name: Update profile art

"on":
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install generator dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Generate personalized tech arsenal
        run: python scripts/render_tech_arsenal.py
      - name: Commit refreshed art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech-arsenal.svg
          if git diff --cached --quiet; then
            echo "Profile art is already up to date."
          else
            git commit -m "chore: refresh animated profile art [skip ci]"
            git push
          fi
