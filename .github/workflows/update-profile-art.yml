name: Update profile art

"on":
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install generator dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Generate animated profile art
        run: |
          python scripts/fetch_contributions.py
          python scripts/fetch_avatar.py
          python scripts/render_heatmap_svg.py
          python scripts/make_ascii_svg.py source-prepped.png ascii-portrait.svg
          python scripts/render_stats_svg.py
          python scripts/render_tech_arsenal.py
        env:
          GITHUB_USERNAME: Aisyahnov
      - name: Commit refreshed art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json source-prepped.png contrib-heatmap.svg ascii-portrait.svg stats.svg tech-arsenal.svg
          if git diff --cached --quiet; then
            echo "Profile art is already up to date."
          else
            git commit -m "chore: refresh animated profile art [skip ci]"
            git push
          fi
